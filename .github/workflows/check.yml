name: check
# Quick compile check for the touch-controls work: the render crate on Linux, plus its touch tests.
on:
  workflow_dispatch:
  push:
    branches: [starling-look]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-render
      - name: Check the render crate
        run: cargo check --locked -p horizon-client-render --tests
      - name: Touch drawing tests
        run: |
          cargo test --locked -p horizon-client-render touch:: -- --test-threads=2
